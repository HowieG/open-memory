<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenMemory — Consent</title>
  <style>
    :root {
      /* Dark purple pulled from the OpenMemory logo */
      --om-purple: #4C1D95;
      --om-purple-bright: #7C3AED;
      --om-check-bg: #EDE7FB;       /* light purple — checkbox background */
      --om-page-bg: #F3EFFC;        /* light purple page background */
      --om-text: #15151A;
      --om-border: #ECECF1;
    }

    * { box-sizing: border-box; }

    /* Inline-editable text */
    [contenteditable] { outline: none; cursor: text; border-radius: 4px; }
    [contenteditable]:hover { box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15); }
    [contenteditable]:focus { box-shadow: 0 0 0 2px var(--om-purple-bright); }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--om-page-bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 32px;
    }

    /* ---- Card ---- */
    .om-card {
      position: relative;
      width: 640px;
      max-width: 100%;
      background: #fff;
      border-radius: 32px;
      padding: 48px 56px 40px;
      box-shadow: 0 24px 60px rgba(20, 10, 50, 0.18);
    }

    .om-close {
      position: absolute;
      top: 28px;
      right: 28px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: #F1F1F4;
      color: #555;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .om-close:hover { background: #E7E7EC; }

    /* ---- Brand label ---- */
    .om-brand {
      margin: 8px 0 28px;
      text-align: center;
      font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      font-weight: 700;
      font-size: 40px;
      letter-spacing: -0.02em;
      color: var(--om-purple);
    }

    /* ---- Overlapping logos (clickable upload slots) ---- */
    .om-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }
    .om-logo {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--om-check-bg);
      border: 2px dashed #C9B8EE;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .om-logo:hover {
      border-color: var(--om-purple-bright);
      background: #E6DBFA;
    }
    .om-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;             /* shown once a file is picked */
    }
    /* Once a logo is uploaded, keep the circle and contain the image inside it. */
    .om-logo.has-image {
      border-style: solid;
      border-color: transparent;
      background: #fff;
    }
    .om-logo.has-image img { display: block; }
    .om-logo .om-logo-hint {
      color: var(--om-purple);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      padding: 0 8px;
      pointer-events: none;
    }
    .om-logo.has-image .om-logo-hint { display: none; }
    .om-logo input { display: none; }

    .om-logo-left  { z-index: 1; }
    .om-logo-right {
      z-index: 2;            /* right slot overlaid on top */
      margin-left: -40px;    /* overlap onto the left slot */
    }

    /* ---- Headline ---- */
    .om-headline {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--om-text);
      margin: 0 0 32px;
      white-space: nowrap;
    }
    .om-headline .om-app { color: var(--om-purple-bright); }

    /* ---- Memory list ---- */
    .om-list {
      width: 70%;                 /* 30% narrower than the card body */
      margin: 0 auto 32px;
      border: 1px solid var(--om-border);
      border-radius: 20px;
      overflow: hidden;
    }
    .om-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      font-size: 19px;
      color: var(--om-text);
    }
    .om-item + .om-item { border-top: 1px solid var(--om-border); }

    .om-check {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--om-check-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--om-purple);
    }
    .om-check svg { width: 18px; height: 18px; }

    /* ---- Connect button ---- */
    .om-connect {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 22px;
      font-size: 21px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(180deg, #8B45E8 0%, #7C3AED 100%);
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.45);
    }
    .om-connect:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="om-card">
    <div class="om-brand" contenteditable="true">OpenMemory</div>

    <div class="om-logos">
      <label class="om-logo om-logo-left">
        <span class="om-logo-hint">Upload logo</span>
        <img alt="Left logo" />
        <input type="file" accept="image/*" />
      </label>
      <label class="om-logo om-logo-right">
        <span class="om-logo-hint">Upload logo</span>
        <img alt="Right logo" />
        <input type="file" accept="image/*" />
      </label>
    </div>

    <h2 class="om-headline">
      <span class="om-app" contenteditable="true">Travel Weekly</span> <span contenteditable="true">wants to read these memories</span>
    </h2>

    <div class="om-list">
      <div class="om-item">
        <span class="om-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span contenteditable="true">trips you're researching</span>
      </div>
      <div class="om-item">
        <span class="om-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span contenteditable="true">lifestyle</span>
      </div>
      <div class="om-item">
        <span class="om-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span contenteditable="true">price sensitivity</span>
      </div>
      <div class="om-item">
        <span class="om-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span contenteditable="true">hobbies</span>
      </div>
      <div class="om-item">
        <span class="om-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span contenteditable="true">restaurant preferences</span>
      </div>
    </div>

    <button class="om-connect"><span contenteditable="true">Connect</span></button>
  </div>

  <script>
    document.querySelectorAll('.om-logo').forEach(function (slot) {
      var input = slot.querySelector('input');
      var img = slot.querySelector('img');
      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        if (!file) return;
        img.src = URL.createObjectURL(file);
        slot.classList.add('has-image');
      });
    });
  </script>
</body>
</html>
